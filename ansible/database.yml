---
- name: Configure MongoDB Database Server
  hosts: database
  become: true

  tasks:

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600


    - name: Install required packages
      apt:
        name:
          - curl
          - gnupg
          - ufw
        state: present


    - name: Download MongoDB GPG key
      shell: |
        curl -fsSL https://pgp.mongodb.com/server-8.0.asc \
        | gpg --dearmor \
        -o /usr/share/keyrings/mongodb-server-8.0.gpg
      args:
        creates: /usr/share/keyrings/mongodb-server-8.0.gpg


    - name: Configure MongoDB repository
      copy:
        dest: /etc/apt/sources.list.d/mongodb-org-8.0.list
        content: |
          deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/8.0 multiverse


    - name: Update apt after MongoDB repo
      apt:
        update_cache: yes


    - name: Install MongoDB
      apt:
        name: mongodb-org
        state: present


    - name: Configure MongoDB bind address
      lineinfile:
        path: /etc/mongod.conf
        regexp: '^\s*bindIp:'
        line: '  bindIp: 127.0.0.1,{{ ansible_facts["default_ipv4"]["address"] }}'


    - name: Start and enable MongoDB
      systemd:
        name: mongod
        enabled: yes
        state: restarted


    - name: Wait for MongoDB
      wait_for:
        port: 27017
        host: 127.0.0.1
        timeout: 60

    - name: Check if MongoDB administrator exists
      shell: |
        mongosh admin \
        -u "{{ mongo_admin_user }}" \
        -p "{{ mongo_admin_password }}" \
        --authenticationDatabase admin \
        --quiet \
        --eval 'db.getUser("{{ mongo_admin_user }}")'
      register: mongo_admin_check
      changed_when: false
      failed_when: false


    - name: Create MongoDB administrator
      shell: |
        mongosh admin --quiet --eval '
        db.createUser({
          user: "{{ mongo_admin_user }}",
          pwd: "{{ mongo_admin_password }}",
          roles: [
            { role: "userAdminAnyDatabase", db: "admin" },
            { role: "readWriteAnyDatabase", db: "admin" }
          ]
        })
        '
      when: mongo_admin_check.rc != 0
      register: mongo_admin_creation


    - name: Create application database user
      shell: |
        mongosh admin \
        -u "{{ mongo_admin_user }}" \
        -p "{{ mongo_admin_password }}" \
        --authenticationDatabase admin \
        --quiet \
        --eval '
        db = db.getSiblingDB("{{ mongo_database }}");
        db.createUser({
          user: "{{ mongo_app_user }}",
          pwd: "{{ mongo_app_password }}",
          roles: [
            { role: "readWrite", db: "{{ mongo_database }}" }
          ]
        })
        '
      register: mongo_app_creation
      failed_when:
        - mongo_app_creation.rc != 0
        - '"already exists" not in mongo_app_creation.stderr'


    - name: Enable MongoDB authentication
      blockinfile:
        path: /etc/mongod.conf
        marker: "# {mark} ANSIBLE MANAGED SECURITY"
        block: |
          security:
            authorization: enabled


    - name: Restart MongoDB after authentication configuration
      systemd:
        name: mongod
        state: restarted


    - name: Enable UFW
      ufw:
        state: enabled
        policy: deny


    - name: Allow SSH
      ufw:
        rule: allow
        port: "22"
        proto: tcp


    - name: Allow MongoDB from VPC
      ufw:
        rule: allow
        port: "27017"
        proto: tcp
        src: "10.0.1.0/24"
